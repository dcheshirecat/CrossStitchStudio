<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cross Stitch Studio</title>
<style>
:root{--bg:#faf7f2;--fg:#2a2420;--mut:#7a6f66;--card:#fff;--bd:#e4dcd2;--ac:#b4453a;--acf:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1a18;--fg:#f1ebe4;--mut:#a89d92;--card:#2a2623;--bd:#413a35;--ac:#e0705f;--acf:#1d1a18}}
:root[data-theme="dark"]{--bg:#1d1a18;--fg:#f1ebe4;--mut:#a89d92;--card:#2a2623;--bd:#413a35;--ac:#e0705f;--acf:#1d1a18}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,sans-serif;padding:12px;max-width:900px;margin:auto}
h1{font-size:20px;margin:4px 0 10px}.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}.row label{flex:1 1 130px;display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--mut)}
.row label.ck{flex-direction:row;align-items:center;gap:6px;color:var(--fg)}
input[type=number],select,input[type=text]{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
.btn,button{background:var(--ac);color:var(--acf);border:0;border-radius:8px;padding:9px 14px;font:inherit;cursor:pointer;display:inline-block}
button.s{background:var(--bd);color:var(--fg);padding:5px 10px}
#wrap{overflow:auto;max-height:70vh;border:1px solid var(--bd);border-radius:8px;margin-top:10px;background:#fff}
#wrap p{color:#777;padding:20px;margin:0}canvas{display:block}
.lg{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--bd);font-size:13px}
.sw{width:22px;height:22px;border-radius:4px;border:1px solid #888;flex:none;display:flex;align-items:center;justify-content:center;font-size:14px;color:#000;background:#fff}
.lg span:nth-child(3){flex:1}.m{color:var(--mut);font-size:13px}#msg{color:var(--ac);font-size:13px;min-height:18px}
</style></head><body>
<h1>Cross Stitch Studio</h1>
<div class="card">
<label class="btn">Choose photo<input type="file" id="f" accept="image/*" hidden></label>
<div class="row">
<label>Width (stitches)<input type="number" id="w" min="20" max="200" value="80"></label>
<label>Fabric count<select id="ct"><option>11</option><option selected>14</option><option>16</option><option>18</option><option>22</option></select></label>
<label>Max colours: <b id="kv">20</b><input type="range" id="k" min="2" max="40" value="20"></label>
</div>
<div class="row">
<label class="ck"><input type="checkbox" id="dt">Dither</label>
<label class="ck"><input type="checkbox" id="cl" checked>Clean stray stitches</label>
<label class="ck"><input type="checkbox" id="ol">Backstitch outline</label>
</div></div>
<div class="card">
<div class="m" id="info">Choose a photo to generate a pattern.</div>
<div class="row">
<label>View<select id="vm"><option value="sym">Symbols</option><option value="col">Colours</option></select></label>
<label>Zoom<input type="range" id="z" min="4" max="30" value="14"></label>
<label class="ck"><input type="checkbox" id="pg">Stitching mode (tap to mark done)</label>
</div>
<div id="wrap"><p>Your chart will appear here.</p><canvas id="cv" hidden></canvas></div>
</div>
<div class="card"><b>Thread legend</b><div id="leg" class="m">—</div></div>
<div class="card"><b>Projects</b>
<div class="row"><label>Project name<input type="text" id="nm" placeholder="e.g. Sunset"></label></div>
<div class="row" style="align-items:center"><button id="sv">Save project</button><button id="pd">Export PDF</button></div>
<div id="msg"></div><div id="pl"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

const SY=Array.from("●■▲◆★+×○□△◇☆#@%&=?!ABCDEFGHJKLMNPRSTUVWXYZ♥♣♠♦");
let S={w:80,count:14,k:20,dither:0,clean:1,outline:0,m:'sym',z:14,prog:0,img:'',name:''},IM=null,G=null,D=null,P=[];
const ST={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v);return 1}catch(e){return 0}},del:k=>{try{localStorage.removeItem(k)}catch(e){}},keys:()=>{try{return Object.keys(localStorage).filter(k=>k.startsWith('xs:'))}catch(e){return[]}}};
const msg=t=>$('msg').textContent=t||'';
function rd(){S.w=Math.min(200,Math.max(20,+$('w').value||80));S.count=+$('ct').value;S.k=+$('k').value;S.dither=$('dt').checked;S.clean=$('cl').checked;S.outline=$('ol').checked;S.m=$('vm').value;S.z=+$('z').value;S.prog=$('pg').checked;$('kv').textContent=S.k}
function build(done){
 const w=S.w,h=Math.max(1,Math.round(w*IM.height/IM.width)),n=w*h;S.h=h;

 let C=[];for(let j=0;j<k;j++)C.push(px[ord[Math.floor((j+.5)*n/k)]].slice());
 for(let it=0;it<8;it++){const s=C.map(()=>[0,0,0,0]);
  for(let i=0;i<n;i++){let b=0,bd=1e9;const p=px[i];for(let j=0;j<k;j++){const q=C[j],dd=(p[0]-q[0])**2+(p[1]-q[1])**2+(p[2]-q[2])**2;if(dd<bd){bd=dd;b=j}}const t=s[b];t[0]+=p[0];t[1]+=p[1];t[2]+=p[2];t[3]++}

const sk=q=>Math.max(1,Math.ceil(q*2.4*(25.4/S.count)*2*1.2/8000));
function drawChart(cv,c0,r0,c1,r1,z,m,sd){

  if(sd&&D[i]){x.fillStyle='rgba(90,200,110,.4)';x.fillRect(X,Y,z,z)}}

 for(let c=c0;c<=c1;c++){const t=c%10===0;if(!t&&z<8)continue;x.strokeStyle=t?'#444':'#ccc';x.lineWidth=t?1.5:.5;const X=gu+(c-c0)*z;x.beginPath();x.moveTo(X,gu);x.lineTo(X,gu+H*z);x.stroke();if(t&&c>0&&c<=c1)x.fillText(c,X,gu/2)}
 for(let r=r0;r<=r1;r++){const t=r%10===0;if(!t&&z<8)continue;x.strokeStyle=t?'#444':'#ccc';x.lineWidth=t?1.5:.5;const Y=gu+(r-r0)*z;x.beginPath();x.moveTo(gu,Y);x.lineTo(gu+W*z,Y);x.stroke();if(t&&r>0)x.fillText(r,gu/2,Y)}

}
function draw(){if(!G)return;const cv=$('cv');cv.hidden=false;document.querySelector('#wrap p').hidden=true;drawChart(cv,0,0,S.w,S.h,S.z,S.m,1);stats()}
function stats(){if(!G)return;const n=S.w*S.h,dn=D.reduce((a,b)=>a+b,0),cm=v=>(v/S.count*2.54).toFixed(1);

function go(){if(!IM)return;rd();build();draw()}
