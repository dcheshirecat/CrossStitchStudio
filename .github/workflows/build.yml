name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Generate Android project
        run: |
          mkdir -p app/src/main/assets app/src/main/java/com/daniel/crossstitch
          cp index.html app/src/main/assets/index.html
          curl -fsSL -o app/src/main/assets/jspdf.umd.min.js https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js
          sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js#jspdf.umd.min.js#' app/src/main/assets/index.html
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'CrossStitch'
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.daniel.crossstitch'
            compileSdk 34
            defaultConfig {
              applicationId 'com.daniel.crossstitch'
              minSdk 29
              targetSdk 34
              versionCode 1
              versionName '1.0'
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:icon="@mipmap/ic_launcher" android:label="Cross Stitch Studio" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          mkdir -p app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26
          cat > app/src/main/res/drawable/ic_bg.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#B4453A" android:pathData="M0,0h108v108h-108z"/>
          </vector>
          EOF
          cat > app/src/main/res/drawable/ic_fg.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:strokeColor="#FAF7F2" android:strokeWidth="6" android:strokeLineCap="round" android:pathData="M33,33L53,53M53,33L33,53M55,55L75,75M75,55L55,75"/>
            <path android:strokeColor="#F2C14E" android:strokeWidth="6" android:strokeLineCap="round" android:pathData="M55,33L75,53M75,33L55,53M33,55L53,75M53,55L33,75"/>
          </vector>
          EOF
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@drawable/ic_bg"/>
            <foreground android:drawable="@drawable/ic_fg"/>
          </adaptive-icon>
          EOF
          cat > app/src/main/java/com/daniel/crossstitch/MainActivity.java <<'EOF'
          package com.daniel.crossstitch;
          import android.app.Activity;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.webkit.*;
          import android.widget.Toast;
          import java.io.OutputStream;
          public class MainActivity extends Activity {
            WebView wv;
            ValueCallback<Uri[]> cb;
            public class Bridge {
              @JavascriptInterface
              public void savePdf(String b64, String name) {
                String msg = "Saved to Downloads";
                try {
                  byte[] d = Base64.decode(b64, Base64.DEFAULT);
                  ContentValues v = new ContentValues();
                  v.put(MediaStore.MediaColumns.DISPLAY_NAME, name);
                  v.put(MediaStore.MediaColumns.MIME_TYPE, "application/pdf");
                  v.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                  Uri u = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
                  OutputStream o = getContentResolver().openOutputStream(u);
                  o.write(d);
                  o.close();
                } catch (Exception e) {
                  msg = "Could not save PDF";
                }
                final String m = msg;
                runOnUiThread(() -> Toast.makeText(MainActivity.this, m, Toast.LENGTH_LONG).show());
              }
            }
            @Override
            protected void onCreate(Bundle b) {
              super.onCreate(b);
              wv = new WebView(this);
              setContentView(wv);
              WebSettings s = wv.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setAllowFileAccess(true);
              wv.addJavascriptInterface(new Bridge(), "Android");
              wv.setWebChromeClient(new WebChromeClient() {
                @Override
                public boolean onShowFileChooser(WebView w, ValueCallback<Uri[]> c, FileChooserParams p) {
                  if (cb != null) cb.onReceiveValue(null);
                  cb = c;
                  try {
                    startActivityForResult(p.createIntent(), 1);
                  } catch (Exception e) {
                    cb = null;
                    return false;
                  }
                  return true;
                }
              });
              wv.loadUrl("file:///android_asset/index.html");
            }
            @Override
            public void onBackPressed() {
              wv.evaluateJavascript("(window.goBack&&window.goBack())?'1':'0'", v -> {
                if (!"\"1\"".equals(v)) finish();
              });
            }
            @Override
            protected void onActivityResult(int r, int c, Intent i) {
              if (r == 1 && cb != null) {
                cb.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(c, i));
                cb = null;
              }
            }
          }
          EOF
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: CrossStitchStudio-APK
          path: app/build/outputs/apk/debug/app-debug.apk
