<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cross Stitch Studio</title>
<style>
:root{--bg:#faf7f2;--fg:#2a2420;--mut:#7a6f66;--card:#fff;--bd:#e4dcd2;--ac:#b4453a;--acf:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1a18;--fg:#f1ebe4;--mut:#a89d92;--card:#2a2623;--bd:#413a35;--ac:#e0705f;--acf:#1d1a18}}
:root[data-theme="dark"]{--bg:#1d1a18;--fg:#f1ebe4;--mut:#a89d92;--card:#2a2623;--bd:#413a35;--ac:#e0705f;--acf:#1d1a18}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,sans-serif;padding:12px;max-width:900px;margin:auto}
h1{font-size:20px;margin:4px 0 10px}.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}.row label{flex:1 1 130px;display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--mut)}
.row label.ck{flex-direction:row;align-items:center;gap:6px;color:var(--fg)}
input[type=number],select,input[type=text]{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
.btn,button{background:var(--ac);color:var(--acf);border:0;border-radius:8px;padding:9px 14px;font:inherit;cursor:pointer;display:inline-block}
button.s{background:var(--bd);color:var(--fg);padding:5px 10px}
#wrap{overflow:auto;max-height:70vh;border:1px solid var(--bd);border-radius:8px;margin-top:10px;background:#fff}
#wrap p{color:#777;padding:20px;margin:0}canvas{display:block}
.lg{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--bd);font-size:13px}
.sw{width:22px;height:22px;border-radius:4px;border:1px solid #888;flex:none;display:flex;align-items:center;justify-content:center;font-size:14px;color:#000;background:#fff}
.lg span:nth-child(3){flex:1}.m{color:var(--mut);font-size:13px}#msg{color:var(--ac);font-size:13px;min-height:18px}
[hidden]{display:none!important}#wrap{touch-action:pan-x pan-y}#wrap.mk{touch-action:none}#nw{width:100%;padding:14px;font-size:16px}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:10px}.bar b{flex:1;text-align:center}
.pc{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px;margin-top:10px;cursor:pointer}
.pc img{width:64px;height:64px;object-fit:cover;border-radius:8px;background:#fff}.pc>div{flex:1}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:9;padding:12px}#dlg>.card{max-height:90vh;overflow:auto;width:100%;max-width:420px;margin:0}
#wh{touch-action:none;width:180px;height:180px;border-radius:50%}#sg{display:flex;flex-wrap:wrap;gap:4px;max-height:110px;overflow:auto;margin:6px 0}.sb{padding:3px 7px;font-size:16px}
</style></head><body>
<div id="home" class="scr">
<h1>Cross Stitch Studio</h1>
<button id="nw">+ New pattern</button>
<div id="pl"></div>
</div>
<div id="make" class="scr" hidden>
<div class="bar"><button class="s" data-go="home">‹ Back</button><b>New pattern</b></div>
<div class="card">
<label class="btn">Choose photo<input type="file" id="f" accept="image/*" hidden></label>
<div class="row">
<label>Detail: <b id="wv">80</b> stitches wide<input type="range" id="w" min="20" max="400" value="80"></label>
<label>Max colours: <b id="kv">20</b><input type="range" id="k" min="2" max="60" value="20"></label>
<label>Fabric count<select id="ct"><option>11</option><option selected>14</option><option>16</option><option>18</option><option>22</option></select></label>
</div>
<div class="row">
<label class="ck"><input type="checkbox" id="dt">Dither</label>
<label class="ck"><input type="checkbox" id="cl" checked>Clean stray stitches</label>
<label class="ck"><input type="checkbox" id="ol">Backstitch outline</label>
</div>
<div class="row"><label>Brightness: <b id="bv">0</b><input type="range" id="br" min="-100" max="100" value="0"></label><label>Contrast: <b id="cnv">100</b>%<input type="range" id="co" min="50" max="200" value="100"></label></div>
<div class="row"><label>Project name<input type="text" id="nm" placeholder="e.g. Sunset"></label></div>
<div class="row"><button id="sv">Save &amp; start stitching</button></div>
</div>
<div id="mslot"></div>
</div>
<div id="work" class="scr" hidden>
<div class="bar"><button class="s" data-go="home">‹ Home</button><b id="wt"></b><button class="s" id="ed">Edit pattern</button></div>
<div id="wslot"></div>
<div class="row"><button id="pd">Export PDF</button></div>
</div>
<div id="dlg" hidden><div class="card"><b id="dt2"></b>
<div class="row" style="align-items:center"><canvas id="wh" width="180" height="180"></canvas><div><div id="pv" class="sw" style="width:60px;height:60px"></div><div id="pn" class="m"></div></div></div>
<label class="m">Brightness<input type="range" id="vv" min="0" max="100" value="100"></label>
<div id="symrow"><div class="m">Symbol: <b id="cur"></b> <button class="s" id="sa">Auto</button></div><div id="sg"></div><input type="text" id="cu" placeholder="Type any emoji or symbol" maxlength="4"></div>
<div class="row"><button id="ok">Apply</button><button class="s" id="cx">Cancel</button></div></div></div>
<div id="cp">
<div id="msg"></div>
<div class="card">
<div class="m" id="info">Choose a photo to generate a pattern.</div>
<div class="row">
<label>View<select id="vm"><option value="sym">Symbols</option><option value="col">Colours</option><option value="real">Stitched (realistic)</option></select></label>
<label>Zoom<input type="range" id="z" min="4" max="30" value="14"></label>
<label class="ck" id="pgl" hidden><input type="checkbox" id="pg">Stitching mode (tap or slide to mark done)</label>
</div>
<div id="wrap"><p>Your chart will appear here. Drag to scroll, pinch to zoom.</p><canvas id="cv" hidden></canvas></div>
</div>
<div class="card"><b>Thread legend</b><div id="leg" class="m">—</div></div>
<div class="card"><b>Colours</b><div class="m">Tap a thread in the legend to change its colour or symbol.</div>
<div class="row"><button class="s" id="cg">Greyscale</button><button class="s" id="cse">Sepia</button><button class="s" id="cct">Colourize…</button><button class="s" id="crb">Rainbow</button><button class="s" id="ci">Invert</button><button class="s" id="cr">Reset colours</button><button class="s" id="ca">Auto symbols</button></div>
<div class="row"><label>Hue shift: <b id="hv">0</b>°<input type="range" id="hs" min="-180" max="180" value="0"></label><button class="s" id="hb">Apply</button></div></div>
</div>

$('cct').onclick=()=>{dm='tint';wh={h:30,s:.6,v:1};$('vv').value=100;$('dt2').textContent='Colourize palette';$('symrow').hidden=true;$('dlg').hidden=false;wheel()};
$('ci').onclick=()=>recolor(c=>c.map(x=>255-x));
$('cr').onclick=()=>{P0.forEach((o,i)=>Object.assign(o,DM.find(d=>d.c===S.o0[i])));derive();draw();persist()};
$('ca').onclick=()=>{S.sym={};derive();draw();persist()};
$('hs').oninput=()=>$('hv').textContent=$('hs').value;
$('hb').onclick=()=>{const d=+$('hs').value;recolor(c=>{const q=r2h(...c);return h2r((q[0]+d+360)%360,q[1],q[2])});$('hs').value=0;$('hv').textContent=0};
</script></body></html>
